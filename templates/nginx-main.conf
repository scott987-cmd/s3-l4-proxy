user __NGINX_USER__;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

# Distribution-provided dynamic modules. Unmatched wildcard includes are ignored.
include /usr/share/nginx/modules/*.conf;
include /etc/nginx/modules-enabled/*.conf;

events {
    use epoll;
    worker_connections 10240;
    multi_accept on;
}

stream {
    log_format proxy '$remote_addr [$time_local] $protocol $status '
                     'sent=$bytes_sent recv=$bytes_received sess=$session_time '
                     'up=$upstream_addr ct=$upstream_connect_time';
    access_log /var/log/nginx/s3-stream.log proxy buffer=64k flush=5s;

    include /etc/nginx/stream.d/*.conf;
}
