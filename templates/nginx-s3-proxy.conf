# S3-compatible L4 TCP passthrough reference config.
#
# This is the optimized version for SaaS-to-private-storage data access:
# - CLB and nginx both work at L4.
# - TLS is not terminated on the proxy.
# - SigV4 bytes are preserved end to end.
# - proxy_pass is non-variable to avoid nginx stream runtime resolver resets.

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

events {
    use epoll;
    worker_connections 10240;
    multi_accept on;
}

stream {
    log_format proxy '$remote_addr [$time_local] $protocol $status '
                     'sent=$bytes_sent recv=$bytes_received sess=$session_time '
                     'up=$upstream_addr ct=$upstream_connect_time';
    access_log /var/log/nginx/s3-stream.log proxy buffer=64k flush=5s;

    upstream s3_backend {
        # nginx resolves this host once at start/reload through /etc/resolv.conf.
        # Reload nginx if the endpoint DNS result changes.
        server s3-backend.internal.example.com:443 max_fails=3 fail_timeout=15s;
    }

    server {
        listen 443 reuseport;

        proxy_pass s3_backend;

        proxy_connect_timeout 5s;
        proxy_timeout 600s;
        proxy_socket_keepalive on;
        proxy_buffer_size 32k;

        proxy_next_upstream on;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
}
