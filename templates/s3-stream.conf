# S3-compatible L4 TCP passthrough.
# Do not replace this with variable proxy_pass. nginx must resolve upstream
# at start/reload time via the system resolver to avoid runtime resolver resets.
log_format s3_proxy '__CLIENT_ADDR_VAR__ [$time_local] $protocol $status '
                    'sent=$bytes_sent recv=$bytes_received sess=$session_time '
                    'up=$upstream_addr ct=$upstream_connect_time';
access_log /var/log/nginx/s3-stream.log s3_proxy buffer=64k flush=5s;

upstream s3_backend {
    server __S3_BACKEND_HOST__:__S3_BACKEND_PORT__ max_fails=3 fail_timeout=15s;
}

server {
    listen __LISTEN_PORT__ reuseport__LISTEN_OPTIONS__;

    proxy_pass s3_backend;

    proxy_connect_timeout 5s;
    proxy_timeout 600s;
    proxy_socket_keepalive on;
    proxy_buffer_size 32k;

    proxy_next_upstream on;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;
}
